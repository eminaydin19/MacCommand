services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    volumes:
      - ./devices:/data:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MACCOMMAND_RELAY_DOMAIN: ${MACCOMMAND_RELAY_DOMAIN:?set the relay hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [relay]
volumes:
  caddy-data:
  caddy-config:
